services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doorflow
      POSTGRES_USER: doorflow
      POSTGRES_PASSWORD: doorflow_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - doorflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorflow -d doorflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  doorflow_postgres:
