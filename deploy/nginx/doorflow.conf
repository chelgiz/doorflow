# Install as an Nginx file included from the http {} context.
limit_req_zone $binary_remote_addr zone=doorflow_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=doorflow_public:10m rate=60r/m;
limit_req_status 429;
server_tokens off;

server {
    listen 80;
    server_name shop.example.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://shop.example.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.example.ru;

    ssl_certificate /etc/letsencrypt/live/shop.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DoorFlowTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/admin/auth/login {
        limit_req zone=doorflow_login burst=5 nodelay;
        include /etc/nginx/snippets/doorflow-proxy.conf;
    }

    location ~ ^/api/(leads|quotes)$ {
        limit_req zone=doorflow_public burst=20 nodelay;
        include /etc/nginx/snippets/doorflow-proxy.conf;
    }

    location = /api/health {
        access_log off;
        include /etc/nginx/snippets/doorflow-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/doorflow-proxy.conf;
    }
}
